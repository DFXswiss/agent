# Unit tests of the orchestrator and the traceability test (run by `make platform-e2e`, part of `make platform-ci`):
#   cd e2e/platform && coverage run --rcfile=.coveragerc -m pytest -c pytest.ini && coverage report --rcfile=.coveragerc
[pytest]
addopts = --strict-markers --import-mode=importlib -p no:cacheprovider
testpaths = tests test_traceability.py
pythonpath = . tests
xfail_strict = true
