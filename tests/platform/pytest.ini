# Configuration of the platform suites, isolated from the legacy tests/conftest.py
# (docs/platform/spec/07-testing.md, ADR-027). Run through `make platform-test`:
#   pytest -c tests/platform/pytest.ini --confcutdir=tests/platform --import-mode=importlib tests/platform
[pytest]
addopts = --strict-markers --import-mode=importlib
xfail_strict = true
# Hard limit per test (setup, call and teardown; pytest-timeout, FIX-01): SIGALRM in the process that runs the test
# fails it with the tracebacks of every thread, so a hang turns red instead of blocking the run, and the worker goes on
# (its coverage is kept). No test of make platform-ci needs nearly as long; this is a safety net, not a way to wait for
# slow tests. The request-only suites (atk, vm, live) get longer limits and a second stage ends the process of a test
# that outlives its limit by two minutes, with the tracebacks of every thread (tests/platform/conftest.py). That second
# stage replaces faulthandler_timeout (one faulthandler timer per process).
timeout = 180
timeout_method = signal
markers =
    linux: Linux-only guest tests (Landlock, systemd, nftables, cgroup v2)
    live: live tests against real services; never part of make platform-ci
    timing: wall-clock bounds
