# Runtime and state directories of the guest agent (docs/platform/spec/05-runner.md sections 4.3 and 5.1).
d /run/agent-guest 0711 root root -
d /run/agent-guest/harness 0711 root root -
d /var/lib/agent-guest 0700 root root -
d /etc/agent-guest 0700 root root -
# The main orchestrator's agent tool (05-runner.md section 17.4): its state only for its account, its MCP socket only
# for the account and the API process (group platform).
d /var/lib/agent-orch 0700 agent-orch agent-orch -
d /run/agent-orch 0710 agent-orch platform -
