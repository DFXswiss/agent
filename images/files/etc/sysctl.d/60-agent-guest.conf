# agent.dfx.swiss golden image (docs/platform/spec/05-runner.md section 4.3, ADR-045).
# A memfd is never executable: without it a session could run a program from memory through /proc/self/fd, which
# neither Landlock nor the unit's NoExecPaths see (found by the final attack gate ATS-03).
vm.memfd_noexec = 2
