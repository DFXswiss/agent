# A38 report guard — trusted-base audit of the author-measured local CI report.
# Does NOT check out the pull request. Does NOT execute scripts from the PR.
# The composite action is pinned to a reviewed full commit SHA of DFXswiss/agent;
# move the pin only through a reviewed change. Merging this installation onto the
# trusted default branch activates it. mode=enforce publishes failing statuses.
# Repo config: .github/a38.json. Process: docs/a38.md and docs/a38-guard.md.
# The guard authenticates with a per-run installation token of the GitHub App
# dfxswiss-pr-guard. The App's permissions grant the write access the guard
# needs, and the App has its own REST rate-limit pool instead of the
# repository-wide GITHUB_TOKEN budget. Token and slug come from the same step so
# they cannot drift apart, because a slug that does not name the App whose token
# is passed makes the guard post a new comment on every run.

name: dfx pr guard

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: false
        type: string
      all_open:
        description: Reconcile every open pull request
        required: false
        type: boolean
        default: false
  workflow_run:
    # Each CI workflow whose completion can change readiness. Never include this
    # guard workflow itself or the job loops.
    workflows: ["test"]
    types: [completed]

concurrency:
  group: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.all_open)) && format('a38-pr-guard-sweep-{0}', github.repository) || format('a38-pr-guard-event-{0}-{1}', github.repository, github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.event.issue.number || github.event.inputs.pr || github.run_id) }}
  cancel-in-progress: false

# These permissions belong to GITHUB_TOKEN, which the guard no longer uses.
# They are left unchanged in this switch; narrowing them is a separate change.
# Falling back to GITHUB_TOKEN means reverting the change that introduced the
# app-token step, because a failing app-token step skips the guard step.
permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write
  actions: write
  checks: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.all_open)) && 45 || 10 }}
    steps:
      - name: dfx pr guard app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.A38_GUARD_APP_CLIENT_ID }}
          private-key: ${{ secrets.A38_GUARD_APP_PRIVATE_KEY }}
      - name: dfx pr guard
        uses: DFXswiss/agent/.github/actions/a38-guard@63bd283dc9a3b6eb29827af9f690d2ba79ed1f14
        with:
          token: ${{ steps.app-token.outputs.token }}
          actor_app_slug: ${{ steps.app-token.outputs.app-slug }}
          repository: ${{ github.repository }}
          pr: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr || '' }}
          all_open: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.all_open) }}
