[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-core"
version = "0.1.0"
description = "Agent hub: GitHub login, device pairing, team-scoped session-store sync and restore."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "DFX" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0.2",
  "itsdangerous>=2.2.0",
  "cryptography>=42.0.0",
  "psycopg[binary]>=3.2",
  "cbor2>=5.6,<6",
]

[project.optional-dependencies]
test = ["pytest>=8.3.0"]
# Platform hub (src/agent_hub, docs/platform/spec/00-overview.md section 4).
platform = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "cryptography>=50",
  "httpx>=0.27.0",
  "websockets>=13",
]
# Gates of the platform packages (docs/platform/spec/07-testing.md section 3).
platform-test = [
  "pytest>=8.3.0",
  "pytest-xdist>=3.8",
  "pytest-timeout>=2.4",
  "pytest-cov>=7.0",
  "coverage>=7.10.7",
  "jsonschema>=4.23",
  "ruff==0.17.6",
  "mypy==2.4.1",
  "types-jsonschema",
  "types-PyYAML",
]

[project.scripts]
agent-core = "agent_core.__main__:main"
agent-hub = "agent_hub.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_core = ["static/*"]
agent_hub = ["static/**", "db/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Platform packages only (docs/platform/spec/07-testing.md section 3); the legacy test job runs no coverage.
[tool.coverage.run]
source = ["agent_hub"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']

# Lint and types apply to the platform packages only; the Makefile names the paths.
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "C4", "PT"]
ignore = ["PLR2004", "PLR0913"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
warn_unreachable = true
files = ["src/agent_hub", "tests/platform", "scripts"]
