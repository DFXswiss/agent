<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Agent ledger</title>
  <style>
    :root { font-family: ui-sans-serif, system-ui, sans-serif; color: #1a1a1a; background: #f4f1ea; }
    body { margin: 24px; max-width: 1100px; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    .sub { color: #555; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; background: #fff; margin-bottom: 24px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; font-size: 0.92rem; }
    th { background: #efeae0; }
    .failed { color: #c00; }
    .implementing, .working { color: #0b5; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Agent ledger</h1>
  <p class="sub">Local replica including teammates after sync. <span id="stamp"></span></p>
  <p>Device <code id="dev"></code> · GitHub <b id="login"></b></p>
  <h2>Tasks</h2>
  <table id="tasks"><thead><tr><th>Id</th><th>Title</th><th>State</th><th>Origin</th></tr></thead><tbody></tbody></table>
  <h2>Pings</h2>
  <table id="pings"><thead><tr><th>From</th><th>To</th><th>Kind</th><th>Acked</th></tr></thead><tbody></tbody></table>
  <p id="err" class="failed" hidden></p>
  <script>
    function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
    async function tick() {
      const err = document.getElementById("err");
      try {
        const res = await fetch("/api/state");
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        err.hidden = true;
        document.getElementById("stamp").textContent = data.generated_at;
        document.getElementById("dev").textContent = data.device_id;
        document.getElementById("login").textContent = data.login || "not paired";
        document.querySelector("#tasks tbody").innerHTML = (data.tasks || []).map(t =>
          `<tr><td>${esc(t.id)}</td><td>${esc(t.title)}</td><td class="${esc(t.state)}">${esc(t.state)}</td><td>${esc(t._origin_device_id)}</td></tr>`
        ).join("") || "<tr><td colspan='4'>—</td></tr>";
        document.querySelector("#pings tbody").innerHTML = (data.pings || []).map(p =>
          `<tr><td>${esc(p.from_login)}</td><td>${esc(p.to_login)}</td><td>${esc(p.kind)}</td><td>${esc(p.acked_at)}</td></tr>`
        ).join("") || "<tr><td colspan='4'>—</td></tr>";
      } catch (e) {
        err.hidden = false;
        err.textContent = String(e);
      }
    }
    tick();
    setInterval(tick, 2000);
  </script>
</body>
</html>
