# A38 report guard — trusted-base audit of the author-measured local CI report.
# Does NOT check out the pull request. Does NOT execute scripts from the PR.
# The composite action is pinned to a reviewed full commit SHA of DFXswiss/agent;
# move the pin only through a reviewed change. Merging this installation onto the
# trusted default branch activates it. mode=enforce publishes failing statuses.
# Repo config: .github/a38.json. Process: docs/a38.md and docs/a38-guard.md.
# The guard authenticates with the repository's GITHUB_TOKEN, as in
# examples/a38-guard.yml. A dedicated GitHub App token would give it a separate
# REST rate-limit pool; this repository has not needed one.

name: dfx pr guard

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: false
        type: string
      all_open:
        description: Reconcile every open pull request
        required: false
        type: boolean
        default: false
  workflow_run:
    # Each CI workflow whose completion can change readiness. Never include this
    # guard workflow itself or the job loops.
    workflows: ["test"]
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write
  actions: write
  checks: read

jobs:
  guard:
    # The guard's own comments all carry a <!-- PR-GUARD: marker and must not start a run.
    # A skipped job never enters job-level concurrency; human User comments are never skipped.
    if: ${{ !(github.event_name == 'issue_comment' && github.event.comment.user.type == 'Bot' && contains(github.event.comment.body, '<!-- PR-GUARD:')) }}
    concurrency:
      group: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.all_open)) && format('a38-pr-guard-sweep-{0}', github.repository) || format('a38-pr-guard-event-{0}-{1}', github.repository, github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.event.issue.number || github.event.inputs.pr || github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.all_open)) && 45 || 10 }}
    steps:
      - name: dfx pr guard
        uses: DFXswiss/agent/.github/actions/a38-guard@63bd283dc9a3b6eb29827af9f690d2ba79ed1f14
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          pr: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr || '' }}
          all_open: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.all_open) }}
