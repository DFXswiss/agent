[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfx-agent"
version = "0.1.0"
description = "Local session store: record work, pair a device, sync bidirectionally with the hub."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "DFX" }]
dependencies = [
  "httpx>=0.27.0",
  "websockets>=13",
  "psycopg[binary]>=3.2.0",
  "PyYAML>=6.0.2,<7",
  "cryptography>=42.0.0",
  # Legacy hub agent_core (former agent-core repository): its Dockerfile installs this distribution with `pip install .`.
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "itsdangerous>=2.2.0",
  "cbor2>=5.6,<6",
]

[project.optional-dependencies]
test = ["pytest>=8.3.0", "coverage>=7.10.7"]
# Platform runner stack (src/agent_runner, docs/platform/spec/00-overview.md section 4); agent_guest and
# agent_doubles use the standard library only.
platform = [
  "httpx>=0.27.0",
  "websockets>=13",
  "psycopg[binary]>=3.2.0",
  "psycopg-pool>=3.2",
  "cryptography>=50",
]
# Platform hub (src/agent_hub, docs/platform/spec/00-overview.md section 4; ADR-061): the only dependencies the hub
# image installs (with `--no-deps` for the distribution itself). cbor2 and PyYAML are needed by the legacy agent_core
# modules the hub imports (passkey, signing, config); tests/platform/test_import_boundaries.py keeps this list complete.
hub = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "cryptography>=50",
  "httpx>=0.27.0",
  "websockets>=13",
  "cbor2>=5.6,<6",
  "PyYAML>=6.0.2,<7",
]
# Gates of the platform packages (docs/platform/spec/07-testing.md section 3).
platform-test = [
  "pytest>=8.3.0",
  "pytest-xdist>=3.8",
  "pytest-timeout>=2.4",
  "coverage>=7.10.7",
  "jsonschema>=4.23",
  "ruff==0.17.6",
  "mypy==2.4.1",
  "types-jsonschema",
  "types-PyYAML",
]
# Mailbox and login automation of the runner (docs/platform/spec/05-runner.md section 11).
login = ["playwright>=1.65"]

[project.scripts]
agent = "agent_cli.main:main"
agent-runner = "agent_runner.__main__:main"
agent-guest = "agent_guest.__main__:main"
agent-platform = "agent_platform.__main__:main"
agent-core = "agent_core.__main__:main"
agent-hub = "agent_hub.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_cli = ["static/*", "skills/**"]
agent_doubles = ["**/*.json"]
agent_runner = ["store/migrations/*.sql", "model/model-catalog.json"]
agent_platform = ["guide.md"]
agent_core = ["static/*"]
agent_hub = ["static/**", "db/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "no_pg: tests that must not start a PostgreSQL cluster",
  "timing: wall-clock bounds; CI runs them without coverage tracing, which slows the measured code",
]

[tool.coverage.run]
source = ["agent_cli"]
branch = true
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
# Floor of the measured total line and branch coverage: the total minus 0.1,
# rounded down to one decimal. It only moves up; see CONTRIBUTING.md,
# "Complete test coverage is mandatory".
fail_under = 86.9
precision = 2
show_missing = true
skip_covered = true

# Lint and types apply to the platform packages only; the Makefile names the paths. The platform coverage
# configuration is .coveragerc-platform (runner, guest, doubles, tool and hub together); [tool.coverage] above belongs
# to the legacy suite of agent_cli. The legacy suite of agent_core runs without coverage, as before.
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "C4", "PT"]
ignore = ["PLR2004", "PLR0913"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "scripts/probes", "deploy/monitoring"]
explicit_package_bases = true
warn_unreachable = true
files = ["src/agent_hub", "src/agent_runner", "src/agent_guest", "src/agent_doubles", "src/agent_platform", "scripts/probes", "scripts/*.py", "deploy/monitoring/agent_monitoring", "tests/platform"]
