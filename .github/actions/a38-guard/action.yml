name: dfx pr guard
description: >
  Assess author local-CI reports against the trusted base A38 manifest.
  Never checks out or executes pull-request code.

inputs:
  token:
    description: GitHub token (contents write for markPullRequestReadyForReview, issues write, pull-requests write, statuses write; actions/checks read for lifecycle, actions write for workflow approval and environment deployment approval)
    required: true
  actor_app_slug:
    description: GitHub App slug whose installation token is passed as token; empty keeps the previous resolver, GET /user first and the official Actions bot only when that call returns 401, 403 or 404 and GITHUB_ACTIONS is true, so a user token with no slug resolves to that user
    required: false
    default: ""
  repository:
    description: owner/name override (workflow_dispatch / standalone)
    required: false
    default: ""
  pr:
    description: Pull request number override
    required: false
    default: ""
  all_open:
    description: Reconcile all open PRs in repository (scheduled trusted workflow)
    required: false
    default: "false"
  dry_run:
    description: If true, print prospective JSON and perform no writes
    required: false
    default: "false"
  event_file:
    description: Event payload path (defaults to GITHUB_EVENT_PATH)
    required: false
    default: ""
  event_name:
    description: Event name (defaults to GITHUB_EVENT_NAME)
    required: false
    default: ""
  python_version:
    description: Python version for the trusted interpreter
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install trusted guard dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        PYTHONPATH: ${{ github.action_path }}/../../../src
      run: |
        set -euo pipefail
        # action_path = <repo>/.github/actions/a38-guard → three levels up is the trusted repo root.
        # The installed package declares PyYAML; the action pins its runtime version.
        python -P -m pip install --disable-pip-version-check PyYAML==6.0.2
        # No pip install of the consumer checkout; only PYTHONPATH to trusted sources.

    # The sweep state cache is written only by all-open runs. Any workflow on
    # the default branch, including a pull_request_target run, can write that
    # cache scope, so the CLI treats the file as untrusted input: it bounds every
    # entry to 24 hours and never writes a status, comment, approval or Ready
    # from it. A full reconcile runs whenever a fingerprint cannot be built.
    - name: Restore sweep state
      if: ${{ inputs.all_open == 'true' && inputs.dry_run != 'true' }}
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/a38-sweep-state.json
        key: a38-sweep-v1-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: a38-sweep-v1-${{ github.repository }}-

    - name: Run dfx pr guard
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GH_TOKEN: ${{ inputs.token }}
        GITHUB_TOKEN: ${{ inputs.token }}
        A38_REPOSITORY: ${{ inputs.repository }}
        A38_PR: ${{ inputs.pr }}
        A38_ALL_OPEN: ${{ inputs.all_open }}
        A38_DRY_RUN: ${{ inputs.dry_run }}
        A38_EVENT_FILE: ${{ inputs.event_file }}
        A38_EVENT_NAME: ${{ inputs.event_name }}
        A38_ACTOR_APP_SLUG: ${{ inputs.actor_app_slug }}
        # Empty unless this is a publishing all-open run.
        A38_SWEEP_STATE: ${{ inputs.all_open == 'true' && inputs.dry_run != 'true' && format('{0}/a38-sweep-state.json', runner.temp) || '' }}
        # Composite actions must pass action_ref through env; it identifies the
        # trusted action revision, while github.sha belongs to the consumer.
        A38_RUNTIME_REVISION: ${{ github.action_ref }}
        # Trusted sources only (composite action tree), never the consumer work tree.
        PYTHONPATH: ${{ github.action_path }}/../../../src
      run: |
        set -euo pipefail
        args=(reconcile --json)
        if [ -n "${A38_EVENT_FILE}" ]; then
          args+=(--event-file "${A38_EVENT_FILE}")
        fi
        if [ -n "${A38_EVENT_NAME}" ]; then
          args+=(--event-name "${A38_EVENT_NAME}")
        fi
        if [ -n "${A38_REPOSITORY}" ]; then
          args+=(--repo "${A38_REPOSITORY}")
        fi
        if [ "${A38_ALL_OPEN}" = "true" ]; then
          args+=(--all-open)
          if [ -n "${A38_SWEEP_STATE:-}" ]; then
            args+=(--sweep-state "${A38_SWEEP_STATE}")
          fi
        elif [ -n "${A38_PR}" ]; then
          args+=(--pr "${A38_PR}")
        fi
        if [ "${A38_DRY_RUN}" = "true" ]; then
          args+=(--dry-run)
        fi
        # Token stays in the environment for the guard module only.
        # No subprocess is started against pull-request code.
        PYTHONUNBUFFERED=1 python -uP -c 'from agent_cli.a38_guard import main; raise SystemExit(main())' "${args[@]}"

    # hashFiles cannot see files outside the workspace, so a shell step supplies
    # the existence check the save step needs.
    - name: Check sweep state
      id: sweep-state
      if: ${{ always() && inputs.all_open == 'true' && inputs.dry_run != 'true' }}
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        if [ -f "${RUNNER_TEMP}/a38-sweep-state.json" ]; then
          echo "present=true" >> "${GITHUB_OUTPUT}"
        else
          echo "present=false" >> "${GITHUB_OUTPUT}"
        fi

    - name: Save sweep state
      if: ${{ always() && inputs.all_open == 'true' && inputs.dry_run != 'true' && steps.sweep-state.outputs.present == 'true' }}
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/a38-sweep-state.json
        key: a38-sweep-v1-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}
