# Platform hub gate (docs/platform/spec/07-testing.md section 8): lint, types, tests with 100 % coverage, contracts.
name: platform-hub

on:
  pull_request:
    branches: [ad5f2026-agent-platform]
  push:
    branches: [ad5f2026-agent-platform]

permissions:
  contents: read

jobs:
  hub:
    runs-on: ubuntu-latest
    services:
      # Throwaway test server; the password is a constant of this container only.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AGENT_HUB_TEST_POSTGRES: postgresql://postgres:postgres@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          # test_legacy_untouched compares with origin/develop.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[platform,platform-test]"
      # The contract tests also run the TypeScript harness contracts/tools/validate.mjs (Ajv).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci --prefix contracts
      - run: make platform-lint platform-types platform-test platform-contracts
